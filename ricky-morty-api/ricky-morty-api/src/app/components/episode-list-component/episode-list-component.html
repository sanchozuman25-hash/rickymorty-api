<div class="row">
  @for(item of episodeList(); track item.id) {
    <app-episode-item-component [episode]="item"></app-episode-item-component>
  }
</div>

@if (totalItems() > 0) {
<div class="d-flex justify-content-center">
  <ngb-pagination [collectionSize]="totalItems()" [pageSize]="20" [page]="page()" [maxSize]="5"
    (pageChange)="onPageChange($event)" />
</div>
}
